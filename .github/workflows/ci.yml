name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt môi trường Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Tải các module Go phụ thuộc
        run: go mod tidy

      - name: Build Go Gateway
        run: go build -o server cmd/server/main.go

      - name: Cài đặt môi trường Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện Python AI Worker
        run: |
          cd ai-service
          pip install -r requirements.txt

      - name: Cài đặt Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Build Rust Performance Worker
        run: |
          cd rust-service
          cargo build --release
