version: '3.8'

services:
  go-server:
    build: .
    ports:
      - "8080:8080"
    environment:
      - AI_SERVICE_URL=http://ai-worker:8000
      - RUST_SERVICE_URL=http://rust-worker:8001
    depends_on:
      - ai-worker
      - rust-worker

  ai-worker:
    build: ./ai-service
    ports:
      - "8000:8000"

  rust-worker:
    build: ./rust-service
    ports:
      - "8001:8001"
