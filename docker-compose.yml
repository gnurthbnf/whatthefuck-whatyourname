version: '3.8'

services:
  go-server:
    build: .
    ports:
      - "8080:8080"
    environment:
      - AI_SERVICE_URL=http://ai-worker:8000
      - LOG_LEVEL=debug
    depends_on:
      ai-worker:
        condition: service_healthy
    restart: always

  ai-worker:
    build: ./ai-service
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/health'); exit(0 if r.status_code == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: always
