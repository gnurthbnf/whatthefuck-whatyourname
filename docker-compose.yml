version: '3.8'

services:
  # Dịch vụ Go chính (Go-AI-Stream)
  go-server:
    build: .
    ports:
      - "8080:8080"
    environment:
      - AI_SERVICE_URL=http://ai-worker:8000
    depends_on:
      - ai-worker
    restart: always

  # Dịch vụ Python AI Worker phụ trách xử lý AI streaming
  ai-worker:
    build: ./ai-service
    ports:
      - "8000:8000"
    restart: always
